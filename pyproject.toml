[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "env-lineage-audit"
version = "0.2.0"
description = "Inspect AI evaluation: faithful auditing of CI environment lineage manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["inspect_ai>=0.3.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
